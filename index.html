    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap');
      
      body {
        font-family: 'Inter', sans-serif;
        background-color: #0f172a; /* Slate 900 */
        color: #f1f5f9; /* Slate 100 */
      }
      
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #1e293b; 
      }
      ::-webkit-scrollbar-thumb {
        background: #475569; 
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #64748b; 
      }

      /* Markdown Content Styles */
      .markdown-content h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 1rem; margin-top: 1.5rem; color: #f8fafc; }
      .markdown-content h2 { font-size: 1.25rem; font-weight: 600; margin-bottom: 0.75rem; margin-top: 1.25rem; color: #e2e8f0; }
      .markdown-content h3 { font-size: 1.1rem; font-weight: 600; margin-bottom: 0.5rem; margin-top: 1rem; color: #cbd5e1; }
      .markdown-content p { margin-bottom: 1rem; line-height: 1.7; color: #cbd5e1; }
      .markdown-content ul { list-style-type: disc; padding-left: 1.5rem; margin-bottom: 1rem; color: #cbd5e1; }
      .markdown-content ol { list-style-type: decimal; padding-left: 1.5rem; margin-bottom: 1rem; color: #cbd5e1; }
      .markdown-content li { margin-bottom: 0.25rem; }
      .markdown-content a { color: #38bdf8; text-decoration: underline; }
      .markdown-content blockquote { border-left: 4px solid #3b82f6; padding-left: 1rem; font-style: italic; color: #94a3b8; margin-bottom: 1rem; }
      .markdown-content strong { color: #f1f5f9; font-weight: 600; }
      .markdown-content table { width: 100%; border-collapse: collapse; margin-bottom: 1rem; margin-top: 1rem; }
      .markdown-content th { background-color: #1e293b; text-align: left; padding: 0.75rem; border-bottom: 1px solid #334155; color: #e2e8f0; font-weight: 600; }
      .markdown-content td { padding: 0.75rem; border-bottom: 1px solid #334155; color: #cbd5e1; }
      .markdown-content code { background-color: #1e293b; padding: 0.2rem 0.4rem; border-radius: 0.25rem; font-family: monospace; font-size: 0.9em; color: #e2e8f0; }
    </style>
